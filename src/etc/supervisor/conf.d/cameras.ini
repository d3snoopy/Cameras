#Setup supervisor for our camera recorder.
[group:cameras]
programs=cameras_gateway,cameras_record
priority=100

[program:cameras_gateway]
command=/usr/bin/gunicorn cameras:app -c /srv/http/gunicorn_config.py
priority=100
autostart=true
startretries=10
user=camuser
directory=/srv/http

[program:cameras_record]
command=/usr/bin/python /srv/http/start_record.py
priority=10
autostart=true
startretries=10
user=camuser
directory=/srv/http
